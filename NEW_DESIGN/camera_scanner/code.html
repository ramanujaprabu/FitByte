<style>.camera-bracket {
    width: 40px;
    height: 40px;
    border: 2px solid white;
    position: absolute
    }
.bracket-tl {
    top: 0;
    left: 0;
    border-right: none;
    border-bottom: none
    }
.bracket-tr {
    top: 0;
    right: 0;
    border-left: none;
    border-bottom: none
    }
.bracket-bl {
    bottom: 0;
    left: 0;
    border-right: none;
    border-top: none
    }
.bracket-br {
    bottom: 0;
    right: 0;
    border-left: none;
    border-top: none
    }
/* Simulating the camera feed background for demo purposes */
.camera-feed {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCOssbpWFoUPGSDEqmsGB1EqTKvV5t99Yr4d6unGzWdUIpS6jm7LlqmkSfD8i0M2FlMmUHgpeM-_xIDSAd3yrGBwqsFXMEWkPIlIRriJTMlQZEQZUVYNuiYIkfXkx5_bsXNijSzrU8Sg_uBnCGM2UdGT4g5Xifjed9TC0IJLgmoiC67__Nf_kObeLd0m7XFbhZrkyW3k3JlrY8PRzN7ABSX7xo8mSGtWv6MYpPAZ8VBRnnvCel8pBbQ);
    background-size: cover;
    background-position: center
    }</style>

<body class="bg-black text-white h-screen w-screen overflow-hidden font-body-sm flex flex-col selection:bg-surface-variant selection:text-on-surface-variant">
<!-- Top App Bar (Hidden on Mobile Camera View typically, but structurally present if needed. We'll use a custom overlay instead for the camera UI) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center h-16 px-gutter max-w-7xl mx-auto bg-transparent">
<button class="p-2 text-white hover:bg-white/20 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Meal Selector -->
<div class="flex gap-2 bg-black/50 backdrop-blur-md rounded-full p-1 border border-white/20">
<button class="px-4 py-1.5 rounded-full font-label-caps text-label-caps text-white/70 hover:text-white transition-colors">Breakfast</button>
<button class="px-4 py-1.5 rounded-full font-label-caps text-label-caps bg-white text-black font-bold">Lunch</button>
<button class="px-4 py-1.5 rounded-full font-label-caps text-label-caps text-white/70 hover:text-white transition-colors">Dinner</button>
</div>
<button class="p-2 text-white hover:bg-white/20 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">flash_off</span>
</button>
</header>
<!-- Main Camera Area -->
<main class="flex-1 relative w-full h-full">
<!-- The Camera Viewfinder Background -->
<div class="absolute inset-0 w-full h-full camera-feed" data-alt="A close up shot of a healthy green salad with grilled chicken breast, cherry tomatoes, and a light vinaigrette dressing on a white ceramic plate. The image is taken from a top-down perspective, simulating a smartphone camera viewfinder. The lighting is bright and natural, highlighting the fresh textures of the food. The background is slightly blurred. High-contrast minimalism style.">
<div class="absolute inset-0 bg-black/20"></div> <!-- Subtle darkening overlay -->
</div>
<!-- Focus Brackets -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 pointer-events-none opacity-80">
<div class="camera-bracket bracket-tl"></div>
<div class="camera-bracket bracket-tr"></div>
<div class="camera-bracket bracket-bl"></div>
<div class="camera-bracket bracket-br"></div>
<!-- Center reticle -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full"></div>
</div>
<!-- Scanning instructions -->
<div class="absolute top-32 w-full text-center pointer-events-none">
<p class="font-body-lg text-body-lg text-white font-medium drop-shadow-md bg-black/30 inline-block px-4 py-1 rounded-full backdrop-blur-sm">Point at your meal to log</p>
</div>
</main>
<!-- Bottom Controls Area -->
<div class="absolute bottom-20 w-full pb-8 pt-12 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex flex-col items-center justify-end z-40">
<div class="flex justify-between items-center w-full max-w-md px-8 mb-6">
<!-- Gallery Button -->
<button class="flex flex-col items-center justify-center gap-1 text-white hover:opacity-80 transition-opacity">
<div class="w-10 h-10 rounded-lg border border-white/50 bg-black/40 backdrop-blur-sm flex items-center justify-center overflow-hidden relative">
<div class="absolute inset-0 bg-cover bg-center opacity-60" data-alt="Thumbnail of a previously taken food photo showing a bowl of oatmeal. High contrast minimalist style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBd6rURxxSEHncIje6Vo7RiYM7KBgdjEcIz-bVbVtg0OYHQ3n8VMbkyrLqNWaMm-YuqgQTR_H-4MKFAN-Y8Y15iQ2NEq9RtUcT68Lazw2fMU6Ra8vfmVTP8gMwMc87SMzYs0-GXJRZsWjFdM_sEABM-UrgwJNtuqtfHyksJtFi8xFyVVhTggUEvCOyzmXS0WXsVzdBtssYUejilHEmuKtjT4xov504-RiWRfmf91sTPt4PfmHaE6pHe')"></div>
<span class="material-symbols-outlined z-10" style="font-variation-settings: 'FILL' 1;">photo_library</span>
</div>
</button>
<!-- Capture Button -->
<button class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center hover:scale-95 active:scale-90 transition-transform bg-white/20 backdrop-blur-sm">
<div class="w-16 h-16 rounded-full bg-white"></div>
</button>
<!-- Flip Camera -->
<button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-sm border border-white/50 flex items-center justify-center text-white hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">flip_camera_ios</span>
</button>
</div>
<button class="text-white/80 font-body-sm text-body-sm hover:text-white underline decoration-white/30 underline-offset-4">Enter manually</button>
</div>
<!-- BottomNavBar (Shared Component JSON injected) -->
<nav class="fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline bg-surface dark:bg-background flex justify-around items-center h-20 pb-safe px-4 hidden md:hidden"> <!-- Assuming mobile only for bottom nav, hiding on desktop conceptually, but keeping it visible as per prompt's "Bottom navigation visible" -->
<a class="flex flex-col items-center justify-center text-primary dark:text-on-background font-bold scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-caps text-label-caps mt-1">Log</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-fixed-variant scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-label-caps text-label-caps mt-1">Workouts</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-fixed-variant scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined">trending_up</span>
<span class="font-label-caps text-label-caps mt-1">Trends</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-fixed-variant scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</a>
</nav>
<!-- Ensuring bottom nav is visible as requested, overriding typical "hide in camera" logic for this specific requirement -->
<nav class="fixed bottom-0 w-full z-50 border-t border-outline-variant bg-surface flex justify-around items-center h-20 pb-safe px-4">
<a class="flex flex-col items-center justify-center text-primary font-bold scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-caps text-label-caps mt-1">Log</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-label-caps text-label-caps mt-1">Workouts</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined">trending_up</span>
<span class="font-label-caps text-label-caps mt-1">Trends</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary scale-95 active:scale-90 transition-transform hover:opacity-80" href="#">
<span class="material-symbols-outlined">person</span>

</nav>
</body></html>
