<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitByte - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed": "#1b1c1c",
                        "primary-fixed": "#e2e2e2",
                        "inverse-surface": "#2f3131",
                        "primary-fixed-dim": "#c6c6c6",
                        "surface-bright": "#f9f9f9",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary-container": "#848484",
                        "on-secondary": "#ffffff",
                        "outline": "#7e7576",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "surface-container-high": "#e8e8e8",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-primary": "#ffffff",
                        "secondary": "#5e5e5e",
                        "tertiary-fixed": "#e2e2e2",
                        "on-primary-fixed-variant": "#474747",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#5e5e5e",
                        "primary-container": "#1b1b1b",
                        "primary": "#000000",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#646464",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f1f1f1",
                        "outline-variant": "#cfc4c5",
                        "inverse-primary": "#c6c6c6",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-primary-container": "#848484",
                        "on-secondary-fixed-variant": "#464747",
                        "surface": "#f9f9f9",
                        "on-background": "#1a1c1c",
                        "on-surface-variant": "#4c4546",
                        "surface-container": "#eeeeee",
                        "tertiary-container": "#1b1b1b",
                        "secondary-fixed": "#e3e2e2",
                        "on-surface": "#1a1c1c",
                        "surface-dim": "#dadada",
                        "on-tertiary-fixed": "#1b1b1b",
                        "secondary-container": "#e3e2e2",
                        "on-primary-fixed": "#1b1b1b",
                        "background": "#f9f9f9",
                        "surface-container-low": "#f3f3f3"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "lg": "24px",
                        "gutter": "16px",
                        "md": "16px",
                        "sm": "8px",
                        "base": "8px",
                        "xl": "40px",
                        "container-margin": "24px"
                    },
                    fontFamily: {
                        "headline-md": ["Geist", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "body-sm": ["Inter", "sans-serif"],
                        "display-lg": ["Geist", "sans-serif"],
                        "label-caps": ["Geist", "sans-serif"],
                        "headline-lg": ["Geist", "sans-serif"],
                        "mono-data": ["Geist", "sans-serif"],
                        "headline-lg-mobile": ["Geist", "sans-serif"]
                    },
                    fontSize: {
                        "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
                        "body-sm": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.04em", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "mono-data": ["14px", { lineHeight: "20px", letterSpacing: "-0.01em", fontWeight: "500" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f9f9f9;
        }
        /* Custom Input Styles overriding defaults */
        input[type="text"], input[type="email"], input[type="password"] {
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            background-color: transparent;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            border-color: #000000;
            box-shadow: none;
            outline: none;
        }
        /* Material symbols utility */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-4 md:p-container-margin">
<!-- Main Container -->
<main class="w-full max-w-[480px] mx-auto flex flex-col bg-surface-container-lowest border border-[#E5E5E5] rounded-xl p-8 md:p-12">
<!-- Header -->
<header class="mb-xl text-center">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">FitByte</h1>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Create Account</h2>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="fullName">Full Name</label>
<input class="w-full px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="email">Email</label>
<input class="w-full px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<input class="w-full px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Terms Text -->
<p class="font-body-sm text-body-sm text-secondary text-center mt-2">
                By signing up, you agree to our <a class="text-primary hover:underline underline-offset-2" href="#">Terms</a> and <a class="text-primary hover:underline underline-offset-2" href="#">Privacy Policy</a>.
            </p>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-lg hover:bg-inverse-surface transition-colors mt-sm" type="submit">
                Create Account
            </button>
</form>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-body-lg text-body-lg text-secondary">
                Already have an account? <a class="text-primary font-medium hover:underline underline-offset-2" href="#">Sign In</a>
</p>
</div>
</main>
</body></html>
