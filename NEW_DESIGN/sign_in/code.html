<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<style>
        body {
            background-color: #f9f9f9;
        }
        /* Strict 1px border rule implementation for inputs */
        input[type="email"], input[type="password"] {
            border: 1px solid #E5E5E5;
            border-radius: 8px;
        }
        input[type="email"]:focus, input[type="password"]:focus {
            border-color: #000000;
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center px-container-margin py-xl selection:bg-primary selection:text-on-primary">
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Brand / Logo Area -->
<div class="mb-xl text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">FitByte</h1>
</div>
<!-- Heading -->
<div class="w-full mb-lg">
<h2 class="font-headline-lg text-headline-lg text-primary text-center hidden md:block">Sign In</h2>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center md:hidden">Sign In</h2>
</div>
<!-- Form Canvas -->
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<!-- Email Input Group -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-widest" for="email">Email</label>
<input class="w-full px-md py-3 bg-surface-container-lowest font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-baseline">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-widest" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full px-md py-3 bg-surface-container-lowest font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Action Button -->
<button class="w-full mt-sm py-4 bg-primary text-on-primary rounded-lg font-headline-md text-headline-md hover:bg-inverse-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="submit">
                Sign In
            </button>
</form>
<!-- Secondary Action / Sign Up Link -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-secondary">
                Don't have an account? 
                <a class="text-primary hover:underline underline-offset-4 decoration-1 decoration-primary font-medium ml-1" href="#">Sign Up</a>
</p>
</div>
</main>
</body></html>
