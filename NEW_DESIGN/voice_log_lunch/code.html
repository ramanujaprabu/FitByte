<style>
        .waveform-bar {
            width: 8px;
            background-color: #000;
            border-radius: 4px;
            animation: pulse 1s infinite ease-in-out alternate;
        }

        .waveform-bar:nth-child(1) { animation-delay: 0.0s; height: 16px; }
        .waveform-bar:nth-child(2) { animation-delay: 0.1s; height: 32px; }
        .waveform-bar:nth-child(3) { animation-delay: 0.2s; height: 48px; }
        .waveform-bar:nth-child(4) { animation-delay: 0.3s; height: 64px; }
        .waveform-bar:nth-child(5) { animation-delay: 0.4s; height: 48px; }
        .waveform-bar:nth-child(6) { animation-delay: 0.5s; height: 32px; }
        .waveform-bar:nth-child(7) { animation-delay: 0.6s; height: 16px; }

        @keyframes pulse {
            0% { transform: scaleY(0.8); opacity: 0.7; }
            100% { transform: scaleY(1.2); opacity: 1; }
        }

        /* Tonal layering & strict 1px logic as per guidelines */
        .glass-card {
            background-color: #ffffff;
            border: 1px solid #E5E5E5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-background border-b border-outline-variant dark:border-outline transition-colors duration-200 flat no shadows flex justify-between items-center h-16 px-gutter max-w-7xl mx-auto md:flex hidden">
<button class="p-2 text-primary dark:text-on-background hover:bg-surface-container dark:hover:bg-tertiary-container rounded-full" data-icon="menu">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary dark:text-on-background">FitByte</h1>
<button class="p-2 text-primary dark:text-on-background hover:bg-surface-container dark:hover:bg-tertiary-container rounded-full" data-icon="notifications">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Mobile Header -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant md:hidden h-16 flex items-center justify-center px-4">
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary">FitByte</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-28 md:pt-24 px-4 md:px-container-margin max-w-7xl mx-auto w-full flex flex-col">
<!-- Meal Selector (Pill group) -->
<div class="flex justify-center space-x-2 mb-10 overflow-x-auto py-2">
<button class="px-4 py-2 border border-[#E5E5E5] rounded-full text-secondary bg-surface-container-lowest font-body-sm whitespace-nowrap">Breakfast</button>
<button class="px-4 py-2 border border-black rounded-full text-on-primary bg-primary font-body-sm font-semibold whitespace-nowrap">Lunch</button>
<button class="px-4 py-2 border border-[#E5E5E5] rounded-full text-secondary bg-surface-container-lowest font-body-sm whitespace-nowrap">Dinner</button>
<button class="px-4 py-2 border border-[#E5E5E5] rounded-full text-secondary bg-surface-container-lowest font-body-sm whitespace-nowrap">Snack</button>
</div>
<!-- Central Listening Area -->
<div class="flex-grow flex flex-col items-center justify-center text-center space-y-10">
<!-- Animated Waveform -->
<div class="flex items-end justify-center space-x-1 h-20 mb-4">
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
</div>
<div>
<p class="font-label-caps text-label-caps text-secondary mb-2 tracking-widest">LISTENING</p>
<p class="font-headline-lg-mobile md:font-headline-lg text-primary max-w-md mx-auto leading-tight">
                    "I had two eggs, two slices of toast and a banana for lunch."
                </p>
</div>
</div>
<!-- Conversion Output (Bento/Glassmorphism style hint) -->
<div class="mt-8 mb-8 glass-card rounded-lg p-6 w-full max-w-md mx-auto relative overflow-hidden">
<!-- Subtle atmospheric gradient in background of card -->
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-lowest opacity-50 z-0 pointer-events-none"></div>
<div class="relative z-10">
<p class="font-mono-data text-mono-data text-secondary mb-4 flex items-center">
<span class="material-symbols-outlined text-[16px] mr-2 animate-spin-slow" style="font-variation-settings: 'FILL' 0;">sync</span>
                    Converting to items...
                </p>
<ul class="space-y-3">
<li class="flex items-center justify-between py-2 border-b border-[#E5E5E5] last:border-0">
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center mr-3 border border-[#E5E5E5]">
<span class="material-symbols-outlined text-[16px]">egg</span>
</div>
<span class="font-body-lg text-primary">2 Eggs</span>
</div>
</li>
<li class="flex items-center justify-between py-2 border-b border-[#E5E5E5] last:border-0">
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center mr-3 border border-[#E5E5E5]">
<span class="material-symbols-outlined text-[16px]">bakery_dining</span>
</div>
<span class="font-body-lg text-primary">2 Toast</span>
</div>
</li>
<li class="flex items-center justify-between py-2 border-b border-[#E5E5E5] last:border-0">
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center mr-3 border border-[#E5E5E5]">
<span class="material-symbols-outlined text-[16px]">nutrition</span>
</div>
<span class="font-body-lg text-primary">1 Banana</span>
</div>
</li>
</ul>
</div>
</div>
<!-- Confirm Action -->
<div class="flex justify-center mt-auto pb-4 w-full max-w-md mx-auto">
<button class="w-full bg-primary text-on-primary font-body-sm font-semibold py-4 rounded-lg hover:bg-tertiary-container transition-colors shadow-sm">
                CONFIRM LOG
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-background border-t border-outline-variant dark:border-outline flat no shadows flex justify-around items-center h-20 pb-safe px-4 md:hidden">
<!-- Active: Log (matches Voice Log screen intent) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-on-background font-bold hover:opacity-80 scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-caps text-label-caps">Log</span>
</a>
<!-- Inactive items -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-fixed-variant hover:opacity-80 scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="fitness_center">fitness_center</span>
<span class="font-label-caps text-label-caps">Workouts</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-fixed-variant hover:opacity-80 scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="trending_up">trending_up</span>
<span class="font-label-caps text-label-caps">Trends</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-fixed-variant hover:opacity-80 scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<style>
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
    </style>
